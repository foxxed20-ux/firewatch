# Dedicated virtual host; existing applications and default server are unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name firewatch.151.247.25.189.nip.io;
    client_max_body_size 32k;
    location /.well-known/acme-challenge/ { root /var/www/firewatch-acme; }
    location / {
        proxy_pass http://127.0.0.1:18089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
