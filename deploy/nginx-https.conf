server {
    listen 80;
    listen [::]:80;
    server_name firewatch.151.247.25.189.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/firewatch-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name firewatch.151.247.25.189.nip.io;
    ssl_certificate /etc/letsencrypt/live/firewatch.151.247.25.189.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firewatch.151.247.25.189.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:18089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
