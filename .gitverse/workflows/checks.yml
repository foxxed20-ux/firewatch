name: Repository checks

on: [push, pull_request]

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check tracked files and Markdown links
        run: python tools/check_repository.py

  model-contract:
    name: Model contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install model test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<2.12'
          python -m pip install -r requirements-model.txt
      - name: Run model contracts
        run: >-
          python -m pytest -q
          tests/test_competition_contract.py
          tests/test_tree_contract.py
          tests/test_model_runtime_contract.py
          tests/test_training_shapes.py
          tests/test_postprocess_tuning.py

  service-contract:
    name: Service contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install service test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-service.txt pytest httpx
      - name: Run service contracts
        run: python -m pytest -q tests/service

  frontend-contract:
    name: Frontend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser scripts
        run: |
          node --check web/core.js
          node --check web/app.js
      - name: Run frontend contracts
        run: node --test tests/frontend/core.test.cjs
